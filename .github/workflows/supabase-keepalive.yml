# Los proyectos gratuitos de Supabase se pausan tras 7 días sin actividad.
# Este workflow hace una consulta mínima (función ping) cada 3 días para mantenerlo activo.
# Toma la URL y la clave pública de js/config.js, así que no necesita secretos.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 13 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Supabase
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" js/config.js || true)
          KEY=$(grep -oP "supabaseAnonKey:\s*'\K[^']+" js/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase aún no está configurado en js/config.js; nada que hacer."
            exit 0
          fi
          AUTH=()
          # La clave "anon" antigua es un JWT y también va en Authorization; la "publishable" nueva solo en apikey.
          case "$KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $KEY") ;; esac
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" "${AUTH[@]}" -H "Content-Type: application/json" -d '{}'
          echo
          echo "Supabase respondió correctamente."
